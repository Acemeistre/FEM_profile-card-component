<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css" type="text/css">
  <title>Frontend Mentor | Profile card component</title>
</head>

<body>
  <main>
    <article class="card-container">
      <div class="card-banner"></div>
      <div class="profile">
        <img src="./images/image-victor.jpg" alt="photo of Victor Crest" />
        <h1 class="name">Victor Crest<span class="age">26</span></h1>
        <p class="location">London</p>
      </div>
      <div class="statistics">
        <div class="stat">
          <p class="stat-number">80K</p>
          <p class="stat-label">Followers</p>
        </div>
        <div class="stat">
          <p class="stat-number">803K</p>
          <p class="stat-label">Likes</p>
        </div>
        <div class="stat">
          <p class="stat-number">1.4K</p>
          <p class="stat-label">Photos</p>
        </div>
      </div>
    </article>
  </main>
</body>

</html>
